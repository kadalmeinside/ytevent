name: Quality Gates

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer:v2

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install PHP dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare application environment for CI
              run: |
                  cp .env.example .env
                  sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env
                  sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
                  sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
                  sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
                  sed -i '/^DB_DATABASE=/d' .env
                  sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
                  sed -i 's/^SESSION_SECURE_COOKIE=.*/SESSION_SECURE_COOKIE=false/' .env
                  sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
                  php artisan key:generate --force
                  mkdir -p database
                  touch database/database.sqlite
                  php artisan migrate --force

            - name: Install frontend dependencies
              run: npm ci

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Pint format check
              run: ./vendor/bin/pint --test --dirty

            - name: PHP test suite
              run: php artisan test --compact

            - name: Composer security audit
              run: composer audit --locked

            - name: npm runtime security audit
              run: npm audit --omit=dev

            - name: Production frontend build
              run: npm run build

            - name: Browser smoke and accessibility tests
              run: npm run test:e2e
